name: release

# release-please reads the conventional-commit messages landing on main, keeps
# a release PR open with the next version and the CHANGELOG entry, and on merge
# tags the commit and cuts the GitHub release. That release is what publishes.
on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      released: ${{ steps.release.outputs.release_created }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release

  publish:
    needs: release-please
    if: needs.release-please.outputs.released == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          registry-url: 'https://registry.npmjs.org'
      # No dependencies to install: the suite is node:test and node:assert.
      - run: npm test
      # Add --provenance once the repo is public; npm refuses to attest a
      # package published from a private one.
      - run: npm publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
